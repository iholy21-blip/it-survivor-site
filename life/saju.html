<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027년 나의 운세</title>
<meta property="og:type" content="website">
<meta property="og:title" content="2027년 나의 운세">
<meta property="og:description" content="재물·직업·사업·연애 네 가지 점수로 보는 2027 운세">
<!-- og:image, og:url 은 배포 주소가 정해지면 절대 주소로 추가 -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="app" data-app="saju">

  <section id="introView">
    <div class="hero">
      <img src="../img/saju.jpg" alt="한옥 창살 그림자가 드리운 탁자 위, 새 달력 옆에 놓인 붉은 도자기 양">
      <div class="hero-text gutter">
        <span class="eyebrow">정미년 · 붉은 양의 해</span>
        <h1 class="title">2027년 나의 운세</h1>
        <p class="subtitle">태어난 날로 보는 재물운 · 직업운 · 사업운 · 연애운</p>
      </div>
    </div>
    <div class="intro-body gutter">
      <form class="card" id="form" novalidate>
        <div class="field">
          <label class="field-title" for="name">이름</label>
          <input type="text" id="name" maxlength="10" placeholder="예: 김은성" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-title" for="year">생년월일 <small>(양력)</small></label>
          <div class="row3">
            <select id="year" aria-label="태어난 해"></select>
            <select id="month" aria-label="태어난 달"></select>
            <select id="day" aria-label="태어난 날"></select>
          </div>
          <div class="hint">음력 생일은 양력으로 바꿔서 넣어 주세요.</div>
        </div>
        <div class="field">
          <label class="field-title" for="hour">태어난 시간</label>
          <select id="hour"></select>
          <div class="hint">모르면 '모름'을 고르세요. 나머지로 풀어 드립니다.</div>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
      <p class="note">재미로 보는 운세입니다. 입력한 정보는 어디에도 저장되지 않습니다.</p>
    </div>
    <div class="spacer"></div>
    <div class="dock gutter"><div class="inner">
      <button type="submit" form="form" class="btn" id="startBtn">운세 확인하기</button>
    </div></div>
  </section>

  <section id="resultView" hidden>
    <div class="result gutter">
      <div class="rcard rise">
        <div class="lbl">2027년 정미년 운세</div>
        <div class="name" id="rName"></div>
        <div class="sub" id="rBirth"></div>
        <div class="headline" id="rSumTitle"></div>
        <div class="sub" id="rSumSub"></div>
        <div class="mini" id="mini"></div>
      </div>
      <div class="card rise" style="animation-delay: .08s">
        <h2>나의 사주 여덟 글자</h2>
        <div class="pillars" id="rPillars"></div>
        <div class="daymaster" id="rDay"></div>
      </div>
      <div id="rLucks" style="display: grid; gap: 14px"></div>
      <p class="note" style="text-align: center">재미로 보는 운세입니다. 중요한 결정은 스스로 판단하세요.</p>
    </div>
    <div class="spacer"></div>
    <div class="dock gutter"><div class="inner">
      <button type="button" class="btn sub" id="againBtn">다시 보기</button>
      <button type="button" class="btn" id="copyBtn">결과 복사해서 보내기</button>
    </div></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="../assets/maker.js"></script>
<script src="../assets/quiz.js"></script>
<script src="tests/saju.js"></script>
</body>
</html>
